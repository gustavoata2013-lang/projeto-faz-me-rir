<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Vendedor - Faça Me Rir</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <div class="header__left">
        <a href="../index.html" class="header__logo">
          <span class="header__logo-img">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8L15 10.2"/></svg>
          </span>
          <span class="header__logo-text">Faça Me Rir</span>
        </a>
      </div>
      <div class="header__center">
        <div class="header__search">
          <input type="text" id="search-input" class="header__search-input" placeholder="Buscar no catálogo..." aria-label="Buscar no catálogo" autocomplete="off">
          <button class="header__search-btn" id="search-btn" aria-label="Buscar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>
      <div class="header__right">
        <button class="header__icon-btn" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema"></button>
        <a href="minha-conta.html" class="btn btn--outline">← Minha conta</a>
        <a href="minha-conta.html" class="btn btn--outline" id="auth-btn">Entrar</a>
        <a href="carrinho.html" class="header__cart" aria-label="Carrinho">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/></svg>
          <span class="header__cart-badge" id="cart-badge" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 class="ads__title">Painel do vendedor</h1>
    <p class="section-header__hint" style="margin-bottom: 1rem;">Resumo da sua loja (dados locais)</p>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-card__label">Anúncios ativos</span>
        <span class="stat-card__value" id="seller-ads">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__label">Valor total anunciado</span>
        <span class="stat-card__value" id="seller-total">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__label">Preço médio</span>
        <span class="stat-card__value" id="seller-avg">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__label">Pedidos</span>
        <span class="stat-card__value">—</span>
      </div>
    </div>

    <h2 class="ads__title" style="margin-top: 2rem;">Meus anúncios</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">
      <a href="meus-anuncios.html" style="color: var(--neon);">Gerenciar meus anúncios →</a>
    </p>

    <h2 class="ads__title" style="margin-top: 2rem;">Seu perfil público</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">
      <a href="vendedor.html" id="public-profile-link" style="color: var(--neon);">Ver meu perfil público →</a>
    </p>
    <form class="admin-item" id="seller-profile-form" style="max-width: 560px;">
      <label class="form__label">Nome de exibição
        <input class="form__input" name="displayName" placeholder="Ex: LoLPro Store">
      </label>
      <label class="form__label">URL do avatar
        <input class="form__input" name="avatar" placeholder="https://exemplo.com/avatar.png">
      </label>
      <label class="form__label">Biografia
        <textarea class="form__input" name="bio" rows="3" placeholder="Conte um pouco sobre sua loja..."></textarea>
      </label>
      <button type="submit" class="btn btn--primary">Salvar perfil</button>
    </form>
  </main>

  <div data-footer></div>

  <div id="modal-root"></div>

  <script src="../js/api-mock.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/seller-store.js"></script>
  <script src="../js/painel-vendedor.js"></script>
</body>
</html>
